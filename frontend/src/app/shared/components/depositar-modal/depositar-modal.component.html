<div
  class="modal-overlay"
  role="presentation"
  (click)="fechar()"
  (keydown.escape)="fechar()"
>
  <div
    class="modal-box"
    role="dialog"
    aria-modal="true"
    aria-labelledby="deposito-modal-titulo"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-heading">
      <div>
        <span class="modal-kicker">SALDO DISPONÍVEL</span>
        <h2 id="deposito-modal-titulo">Depositar saldo</h2>
      </div>
      <button type="button" class="close-button" aria-label="Fechar" [disabled]="carregando()" (click)="fechar()">
        ×
      </button>
    </div>

    <p class="modal-text">Informe o valor que deseja adicionar ao seu saldo disponível.</p>

    <label class="field-label" for="deposito-valor">Valor do depósito</label>
    <input
      id="deposito-valor"
      type="number"
      inputmode="decimal"
      min="0.01"
      step="0.01"
      placeholder="0,00"
      [ngModel]="valor()"
      (ngModelChange)="valor.set($event)"
    />

    @if (erro(); as mensagem) {
      <p class="modal-error" role="alert">{{ mensagem }}</p>
    }

    <div class="modal-actions">
      <button class="btn-secondary" type="button" [disabled]="carregando()" (click)="fechar()">Cancelar</button>
      <button
        class="btn-primary"
        type="button"
        [disabled]="carregando() || !valor() || (valor() ?? 0) <= 0"
        (click)="confirmar()"
      >
        {{ carregando() ? "Depositando..." : "Confirmar depósito" }}
      </button>
    </div>
  </div>
</div>
