server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rendup}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

jwt:
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:1200}
  public:
    key: classpath:certs/public.pem
  private:
    key: classpath:certs/private.pem

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

catalogo:
  sincronizacao:
    tentativas: ${CATALOGO_SYNC_TENTATIVAS:2}
    mock:
      arquivo: ${CATALOGO_MOCK_ARQUIVO:classpath:catalogo/catalogo-mock-v1.json}
      falhar: ${CATALOGO_MOCK_FALHAR:false}
      atraso-ms: ${CATALOGO_MOCK_ATRASO_MS:0}
      timeout-ms: ${CATALOGO_MOCK_TIMEOUT_MS:3000}
